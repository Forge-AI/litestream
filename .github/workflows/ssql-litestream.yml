name: ssql-litestream

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssql-litestream
          fetch-depth: 0
          token: ${{ secrets.FORGE_REBASE_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q https://github.com/benbjohnson/litestream.git main
          upstream=$(git rev-parse FETCH_HEAD)
          replaced=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rebase "$upstream"
          {
            echo "replaced=$replaced"
            echo "rebased=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - if: steps.rebase.outputs.current != 'true'
        run: go vet ./... && go test -count=1 . ./internal ./abs ./file ./gs ./nats ./s3 ./sftp ./cmd/litestream
      - if: steps.rebase.outputs.current != 'true'
        env:
          REPLACED: ${{ steps.rebase.outputs.replaced }}
          REBASED: ${{ steps.rebase.outputs.rebased }}
        run: |
          tag="forge/ssql-litestream/$(date -u +%Y%m%d)-${REPLACED:0:12}"
          git tag "$tag" "$REPLACED"
          git push origin "refs/tags/$tag"
          git push --force-with-lease="ssql-litestream:$REPLACED" origin "$REBASED:refs/heads/ssql-litestream"
