name: ssql-litestream

on:
  push:
    branches: [ssql-litestream]
  pull_request:
    branches: [ssql-litestream]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

env:
  FORGE_TESTS: '^(TestHead_.*|TestPageMap_.*|TestHold_.*|TestServer_HoldAnswersGoneForAFileRetentionDeleted|TestCompactor_Enforce.*|TestDB_Enforce.*|TestStore_Enforce.*|TestDB_FullSnapshotUploadedBeforeItsSyncReturnsNamesItsUploadOnce|TestDB_TwoFullSnapshotsWrittenBeforeUploadsDrainEachNameTheirOwnUpload|TestDB_LevelSnapshotThatCannotReadItsDatabaseSaysSo|TestDB_FullSnapshotNamesItsSizeDurationAndUploadOnce|TestDB_RefusedFullSnapshotUploadSaysSoUntilItLands|TestDB_LevelSnapshotNamesItsSizeAndDuration|TestDB_VerifyReadsOnlyTheLastSyncedPageOfTheLastLTXFile|TestDB_BehindReplicaTakesBaselineAboveSnapshot|TestDB_BrokenLastUploadFileReuploadsFromTheReplica|TestDB_BrokenEarlierUploadFileReuploadsFromTheReplica|TestReplica_LostPositionUnderSnapshotKeepsL0Contiguous|TestReplica_Restore_OpensPlanConcurrently|TestReplica_Restore_ReportsRisingByteCountsEndingAtTheImageSize|TestRestoreProgress_ReportsAWriteOnceTheIntervalHasPassed|TestStore_CompactDB|TestStore_ADatabaseWrittenOnceADayNamesItsUploadsAndStartsLevelOne|TestReplica_UploadLTXFile_RaisesCachedL0Max|TestReplicaClient_LTXFilesListsFromSeek|TestReplicaClient_SignsWithItsDatabasesCredentialSource|TestReplicaClient_SignsWithRotatingSecret|TestDB_SyncAndWaitYieldsToARunningSnapshot|TestDB_SyncAndWaitYieldsWhenTheHolderStartsASnapshot|TestDB_SyncAndWaitQueuesBehindAnIncrementalHolder|TestDB_SyncAndWaitWaitsOutAShortSnapshot|TestDB_SyncAndWaitGivesEachSnapshotItsOwnSecond|TestServer_SyncDuringASnapshotAnswersUnavailable|TestServer_RegisterTakesTheDatabasesIntervals|TestServer_IdleRegisteredDatabasesDoNoWork|TestStore_IdleDatabasesAfterABurstMakeNoCallsAndDoNoWork|TestStore_AfterANetworkDropIdleDatabasesMakeNoCalls|TestServer_ASyncWhoseUploadIsRefusedAnswersForbidden|TestServer_ARegisteredDatabaseCheckpointsOnceASyncLeavesItsWALPastTheThreshold|TestStore_EachSyncDrivenWriteUploadsOneLTXFileAndSyncsOnce|TestServer_ARegisterAfterAStopTakesTheReplicaAndRetentionItNames|TestDB_SyncAndWaitFinishesACheckpointItsCallerAbandons|TestDB_WritesQueuedBehindAPassiveCheckpointKeepTheNextSyncIncremental|TestDB_AbandonStopsAFullCopyInsideACheckpointAndTheNextProcessLosesNothing|TestAbandonAll_ACheckpointInOneDatabaseDoesNotHoldACopyInAnother|TestDB_AbandonKeepsTheTailWithoutSyncing|TestDB_HandoverTXIDResumesTheTruncatedWAL|TestDB_HandoverTXIDBehindTheReplicaSnapshots|TestDB_HandoverWALEndResumesPastTheFramesTheClaimCovers|TestDB_StartupHandoverResumesTheFirstFrame|TestServer_SyncCheckpointDrainsASyncedOnePageLog|TestServer_SyncCheckpointDrainsALogAnEarlierLaneShipped|TestServer_SyncCheckpointKeepsTheReadTransactionPastItsTimeout|TestServer_SyncWithoutCheckpointLeavesTheLogAndAnIdleDatabaseShipsNothing|TestDB_CompactionAndSnapshotNameTheirUploadsInTheMetaDirectory|TestDB_NoLTXFilesOnIdleSync|TestDB_DelayedCheckpointAfterWrite|TestStore_SyncDeadlineNamesInitializationAtAnyDatabaseCount|TestStore_SyncDeadlineReportsOnceOnReturn|TestStore_SyncDeadlineNamesTheStagesAfterTheLocalSync|TestStore_SyncRunsAsLongAsItsUploadMoves|TestStore_SyncEndsOnceItsUploadStopsMoving|TestOwnerGone_.*|TestReplicaClient_MaxAttemptsBoundsTheCallsToABucketThatDropsEveryConnection|TestReplicaClient_MaxAttemptsBoundsTheCallsToAContainerThatDropsEveryConnection|TestReplicaClient_MaxAttemptsBoundsTheCallsToABucketThatAnswersEveryCallUnavailable|TestRestoreCommand_RunGivesUpOnADeadBucketAfterThreeCalls|TestRestoreCommand_RunJSONOutput|TestResumableReader_ReconnectsOnStalledStream)$'

permissions:
  contents: write

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 -run "$FORGE_TESTS" . ./s3 ./abs ./gs ./internal ./cmd/litestream

  rebase:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: ssql-litestream
            test: true
          - branch: ssql-litestream-legacy
            test: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          token: ${{ secrets.FORGE_REBASE_TOKEN }}
      - if: matrix.test
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: before
        run: echo "old=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: imba-tjd/rebase-upstream-action@559f4270ba3c290f6009fc7114398a4ea07fa799
        with:
          upstream: benbjohnson/litestream
          branch: main
          depth: 0
          push: false
      - id: rebase
        run: |
          upstream=$(git rev-parse upstream/main)
          if [ "$(git rev-parse HEAD)" = "${{ steps.before.outputs.old }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${{ matrix.branch }}/$(date -u +%Y%m%d)-$(git rev-parse --short=12 "$upstream")" >> "$GITHUB_OUTPUT"
      - if: matrix.test && steps.rebase.outputs.current != 'true'
        run: go vet ./... && go test -count=1 -run "$FORGE_TESTS" . ./s3 ./abs ./gs ./internal ./cmd/litestream
      - if: steps.rebase.outputs.current != 'true'
        run: |
          git tag "${{ steps.rebase.outputs.tag }}"
          git push origin "${{ steps.rebase.outputs.tag }}"
          git push --force-with-lease=${{ matrix.branch }}:${{ steps.before.outputs.old }} origin HEAD:${{ matrix.branch }}
