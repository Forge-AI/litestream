name: ssql-litestream

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssql-litestream
          fetch-depth: 0
          token: ${{ secrets.FORGE_REBASE_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q https://github.com/benbjohnson/litestream.git main
          upstream=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          replaced=$(git rev-parse HEAD)
          git rebase "$upstream"
          {
            echo "upstream=$upstream"
            echo "replaced=$replaced"
            echo "rebased=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - if: steps.rebase.outputs.current != 'true'
        run: go vet ./... && go test -count=1 . ./internal/... ./abs ./file ./gs ./nats ./s3 ./sftp ./cmd/litestream
      - if: steps.rebase.outputs.current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ steps.rebase.outputs.upstream }}
          REPLACED: ${{ steps.rebase.outputs.replaced }}
          REBASED: ${{ steps.rebase.outputs.rebased }}
        run: |
          branch="rebase/$(date -u +%Y%m%d)-${UPSTREAM:0:12}"
          # A pull request opened with github.token starts no checks, so the branch starts at upstream main and
          # FORGE_REBASE_TOKEN's fast-forward push to the rebased tip is the event that runs them.
          git push origin "$UPSTREAM:refs/heads/$branch"
          gh pr create --base ssql-litestream --head "$branch" \
            --title "sandsql: ⬆️ rebase ssql-litestream onto upstream main ${UPSTREAM:0:12}" \
            --body "The nightly rebased \`ssql-litestream\` (\`$REPLACED\`) onto upstream main \`$UPSTREAM\`, giving \`$REBASED\`, and the line's tests passed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Land it by moving \`ssql-litestream\` to \`$REBASED\` once this pull request's checks pass; do not merge it."
          git push origin "$REBASED:refs/heads/$branch"
